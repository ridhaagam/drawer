services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excalidraw-app
    ports:
      - "3002:80"
    depends_on:
      - collab
      - persistence
    restart: unless-stopped
    networks:
      - excalidraw-net

  collab:
    build:
      context: ./excalidraw-room
      dockerfile: Dockerfile
    container_name: excalidraw-collab
    environment:
      - PORT=3005
      - CORS_ORIGIN=*
    expose:
      - "3005"
    restart: unless-stopped
    networks:
      - excalidraw-net

  persistence:
    build:
      context: ./excalidraw-server
      dockerfile: Dockerfile
    container_name: excalidraw-persistence
    environment:
      - PORT=3010
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    expose:
      - "3010"
    restart: unless-stopped
    networks:
      - excalidraw-net

networks:
  excalidraw-net:
    driver: bridge
